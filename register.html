<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đăng ký - CineMax</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0c1d3d,#14326a);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

/* LOGIN BOX */

.login-container{
background:rgba(255,255,255,0.10);
padding:24px 28px;
width:100%;
max-width:370px;
border-radius:16px;
border:1px solid rgba(255,255,255,0.15);
box-shadow:0 20px 50px rgba(0,0,0,0.25);
width:100%;
}

/* LOGO */

.logo{
text-align:center;
font-size:40px;
color:red;
margin-bottom:14px;
}

/* TITLE */

.login-container h2{
text-align:center;
margin-bottom:20px;
}

/* INPUT */

.input-group{
margin-bottom:14px;
}

.input-group label{
font-size:14px;
}

.input-group input{
width:100%;
padding:12px;
margin-top:5px;
background:rgba(255,255,255,0.12);
border:1px solid rgba(255,255,255,0.18);
border-radius:8px;
color:white;
display:block;
max-width:100%;
box-sizing:border-box;
}

/* BUTTON */

.login-btn{
width:100%;
padding:12px;
background:red;
border:none;
border-radius:10px;
color:white;
font-size:16px;
cursor:pointer;
}

.login-btn:hover{
background:#ff2a2a;
}

/* LINKS */

.back-btn{
display:inline-block;
margin-bottom:14px;
padding:8px 14px;
background:#222;
color:white;
text-decoration:none;
border-radius:6px;
border:1px solid #444;
}

.back-btn:hover{
background:red;
}

.links{
margin-top:15px;
font-size:14px;
}

.links a{
color:#ccc;
text-decoration:none;
}

.links a:hover{
color:white;
}

/* SOCIAL LOGIN */

.social-login{
text-align:center;
margin-top:18px;
}

.social-login p{
color:#aaa;
font-size:14px;
margin-bottom:10px;
}

.social-buttons{
display:flex;
gap:10px;
justify-content:center;
margin-top:10px;
flex-wrap:wrap;
}

.social-buttons a{
padding:10px 14px;
border-radius:5px;
text-decoration:none;
color:white;
font-size:14px;
display:flex;
align-items:center;
gap:6px;
}

.fb{
background:#1877f2;
}

.gg{
background:#db4437;
}

.ig{
background:#e4405f;
}

/* REGISTER LINK */

.register{
text-align:center;
margin-top:18px;
}

.register a{
color:red;
text-decoration:none;
font-weight:bold;
}

.register a:hover{
text-decoration:underline;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.7);
    animation: fadeIn 0.3s ease-in-out;
}

.modal-content {
    background: linear-gradient(135deg, #1a1a1a, #333);
    margin: 10% auto;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    animation: slideIn 0.3s ease-out;
}

.modal-body {
    text-align: center;
    padding: 30px;
    color: white;
}

.bear-image {
    width: 120px;
    height: 120px;
    margin-bottom: 20px;
    border-radius: 50%;
    object-fit: cover;
}

.modal-body h2 {
    color: #4CAF50;
    margin-bottom: 10px;
    font-size: 24px;
}

.modal-body p {
    font-size: 16px;
    margin-bottom: 20px;
}

.close-btn {
    background: red;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

.close-btn:hover {
    background: #ff2a2a;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes slideIn {
    from { transform: translateY(-50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

</style>

</head>

<body>

<div class="login-container">

<div class="logo">CINEMAX</div>


<h2>Đăng ký</h2>

<form id="registerForm">

<div class="input-group">
<label>Họ và tên</label>
<input type="text" id="registerName" placeholder="Nhập họ và tên">
</div>

<div class="input-group">
<label>Email</label>
<input type="email" id="registerEmail" placeholder="Nhập email">
</div>

<div class="input-group">
<label>Mật khẩu</label>
<input type="password" id="registerPassword" placeholder="Nhập mật khẩu">
</div>

<div class="input-group">
<label>Nhập lại mật khẩu</label>
<input type="password" id="registerConfirmPassword" placeholder="Nhập lại mật khẩu">
</div>

<button type="submit" class="login-btn">Đăng ký</button>

<div class="social-login">
<p>Hoặc đăng ký bằng</p>
<div class="social-buttons">
<a href="https://www.facebook.com" target="_blank" class="fb"><i class="fab fa-facebook-f"></i> Facebook</a>
<a href="https://accounts.google.com" target="_blank" class="gg"><i class="fab fa-google"></i> Google</a>
<a href="https://www.instagram.com" target="_blank" class="ig"><i class="fab fa-instagram"></i> Instagram</a>
</div>
</div>

<div class="register">
<p>Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
</div>
<a href="index.html" class="back-btn">← Quay lại</a>
</form>

</div>

<script src="js/register.js"></script>

<!-- Modal đăng ký thành công -->
<div id="successModal" class="modal">
    <div class="modal-content">
        <div class="modal-body">
            <img src="https://i.imgur.com/4M5Q8wJ.gif" alt="Gấu vẫy tay" class="bear-image">
            <h2>Đăng ký thành công!</h2>
            <p>Chào mừng bạn đến với CineMax 🎉</p>
            <button id="closeModal" class="close-btn">Đóng</button>
        </div>
    </div>
</div>

</body>
</html>
